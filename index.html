<style>
  body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background:#0b0c10; }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-thumb { background:#374151; border-radius:4px; }
  .toast { animation: slideDown .3s ease-out forwards; }
  @keyframes slideDown { from { transform:translateY(-100%); opacity:0 } to { transform:translateY(0); opacity:1 } }

<body class="text-slate-100 pb-28 antialiased min-h-screen">

<div id="toasts" class="fixed top-3 left-1/2 -translate-x-1/2 z-[60] w-11/12 max-w-md pointer-events-none space-y-2"></div>

<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white sticky top-0 z-30 shadow-lg">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 shrink-0 rounded-xl bg-purple-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-purple-900/40">$</div>
      <div class="min-w-0">
        <button onclick="openMonths()" class="flex items-center gap-1.5 text-left group">
          <h1 id="hdrTitle" class="text-base font-bold leading-tight group-hover:text-purple-400 transition">—</h1>
          <i class="fa-solid fa-chevron-down text-xs text-purple-400"></i>
        </button>
        <span class="mt-0.5 inline-flex px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-950/80 text-purple-300 border border-purple-800/60 items-center gap-1">
          <span id="hdrDot" class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-pulse"></span><span id="hdrStatus">—</span>
        </span>
      </div>
    </div>
    <div class="flex items-center shrink-0">
      <button onclick="openIncomes()" title="Quincenas e ingresos" class="p-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-wallet text-emerald-400"></i></button>
      <button onclick="openSubs()" title="Suscripciones" class="p-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-rotate text-purple-400"></i></button>
      <button onclick="openMonths()" title="Meses" class="p-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-calendar-days text-purple-400"></i></button>
      <button onclick="openSettings()" title="Ajustes" class="p-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-gear text-slate-300"></i></button>
      <button onclick="exportData()" title="Descargar respaldo" class="p-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-download text-slate-300"></i></button>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-4 space-y-4">
  <div id="alerts" class="space-y-2"></div>
  <div id="summary"></div>
  <div id="debtCard"></div>
  <nav id="tabs" class="flex bg-slate-900 p-1 rounded-xl text-[11px] font-semibold text-slate-400 border border-slate-800"></nav>
  <section id="view" class="space-y-3"></section>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 p-3 z-40">
  <div class="max-w-md mx-auto">
    <button onclick="openMove('gasto')" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2 transition text-sm">
      <i class="fa-solid fa-bolt text-amber-300"></i><span>+ Registrar Movimiento / Diferido / Transferencia</span>
    </button>
  </div>
</div>

<div id="sheet" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden" onclick="if(event.target===this)closeSheet()">
  <div id="sheetBox" class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl"></div>
</div>

/* ================= MESES ================= */
function createMonth(key, fromKey, inc) {
  if (S.months[key]) return S.months[key];
  const prev = fromKey ? S.months[fromKey] : null;
  const budgets = {};
  S.categories.forEach(c => budgets[c.id] = (prev && prev.budgets[c.id] !== undefined) ? prev.budgets[c.id] : c.budget);
  const defInc = { amount: 0, acc: S.accounts[0]?.id, day: 1 };
  const incomes = inc || {
    q1: { ...(prev ? prev.incomes.q1 : defInc) },
    q2: { ...(prev ? prev.incomes.q2 : { ...defInc, day: 15 }) }
  };
  const items = [];
  S.recurring.forEach(r => { if (r.from <= key && (!r.until || r.until >= key)) items.push({ id: uid('i'), name: r.name, amount: r.amount, day: r.day, catId: r.catId, payWith: r.payWith || null, recId: r.id }); });
  const [y, m] = key.split('-').map(Number);
  S.annual.forEach(a => { if (a.month === m && y >= a.fromYear) items.push({ id: uid('i'), name: a.name, amount: a.amount, day: a.day, catId: a.catId || 'c_otr', annualId: a.id }); });
  S.months[key] = { key, budgets, incomes, items, cardOv: {}, loanOv: {} };
  return S.months[key];
}
const monthKeys = () => Object.keys(S.months).sort();
function ensureCurrent() {
  let last = monthKeys().pop();
  const c = curKey();
  while (last < c) { const n = addM(last, 1); createMonth(n, last); last = n; }
}
function monthStatus(k) { const c = curKey(); return k < c ? 'Mes cerrado' : k === c ? 'Mes en curso' : 'Mes planeado'; }

/* ================= MOVIMIENTOS ================= */
function applyTx(t, s) {
  if (t.noBalance) return;
  const A = accBy(t.acc), C = cardBy(t.card);
  const out = () => { if (t.card) { if (C) C.deuda += s * t.amount; } else if (A) A.balance -= s * t.amount; };
  if (t.type === 'gasto') out();
  else if (t.type === 'ingreso') { if (A) A.balance += s * t.amount; }
  else if (t.type === 'transfer') { if (A) A.balance -= s * t.amount; const B = accBy(t.accTo); if (B) B.balance += s * t.amount; }
  else if (t.type === 'pago') {
    out();
    const [kind, id] = t.ref.split(':');
    if (kind === 'card') { const c = cardBy(id); if (c) c.deuda -= s * (t.capital || 0); }
    if (kind === 'loan') { const l = loanBy(id); if (l) l.saldo -= s * (t.capital || 0); }
  }
}
function addTx(t) { S.txs.push(t); applyTx(t, 1); }
function removeTx(id) {
  const t = S.txs.find(x => x.id === id); if (!t) return;
  applyTx(t, -1); S.txs = S.txs.filter(x => x.id !== id);
}
const txMonth = t => t.date.slice(0, 7);

function processSubs() {
  const t = todayStr(); let n = 0;
  S.subs.forEach(sb => {
    if (!cardBy(sb.cardId)) return;
    let guard = 0;
    while (guard++ < 24) {
      const d = dateIn(sb.next, sb.day);
      if (d > t) break;
      addTx({ id: uid('t'), type: 'gasto', auto: true, amount: sb.amount, desc: sb.name + ' (suscripción)', catId: 'c_sus', card: sb.cardId, n: 1, rate: 0, date: d });
      sb.next = addM(sb.next, 1); n++;
    }
  });
  return n;
}

/* ================= TARJETAS Y CRÉDITOS ================= */
function payMonth(card, date) {
  const k = date.slice(0, 7), d = +date.slice(8, 10);
  const corteK = d <= card.corte ? k : addM(k, 1);
  return card.pagoDia > card.corte ? corteK : addM(corteK, 1);
}
function schedule(P, n, ratePct) {
  const i = (n > 1 ? ratePct : 0) / 100, out = [];
  if (!i) { const c = P / n; for (let k = 0; k < n; k++) out.push({ cuota: c, int: 0, cap: c }); return out; }
  const c = P * i / (1 - Math.pow(1 + i, -n)); let bal = P;
  for (let k = 0; k < n; k++) { const it = bal * i, cp = c - it; bal -= cp; out.push({ cuota: c, int: it, cap: cp }); }
  return out;
}
function cardCharges(id) {
  return S.txs.filter(t => t.card === id && !t.noBalance && (t.type === 'gasto' || (t.type === 'pago' && !t.ref.startsWith('card:'))));
}
function paidInfo(ref, k) {
  const r = { amount: 0, capital: 0, interest: 0, full: false, txs: [] };
  S.txs.forEach(t => {
    if (t.type === 'pago' && t.ref === ref && t.forMonth === k) {
      r.amount += t.amount; r.capital += t.capital || 0; r.interest += t.interest || 0;
      if (t.full) r.full = true; r.txs.push(t);
    }
  });
  return r;
}
function cardDue(card, k) {
  let total = 0, interest = 0; const lines = [];
  if (k >= S.startMonth && card.base > 0) { total += card.base; lines.push({ desc: 'Pago base (deuda anterior)', amount: card.base, base: true }); }
  cardCharges(card.id).forEach(t => {
    const n = t.n || 1, first = payMonth(card, t.date), idx = diffM(first, k);
    if (idx < 0 || idx >= n) return;
    const sc = schedule(t.amount, n, t.rate || 0)[idx];
    total += sc.cuota; interest += sc.int;
    lines.push({ desc: (t.desc || 'Compra') + (n > 1 ? ` (cuota ${idx + 1}/${n})` : ''), amount: sc.cuota, date: t.date });
  });
  const cc = S.months[k]?.carry?.['card:' + card.id] || 0;
  if (cc) { total += cc; lines.push({ desc: 'Atrasado del mes anterior', amount: cc }); }
  const ov = S.months[k]?.cardOv?.[card.id];
  const hasOv = ov !== undefined && ov !== null;
  if (hasOv) { total = ov; interest = Math.min(interest, ov); }
  if (k >= curKey()) {
    const cap = Math.max(0, card.deuda + paidInfo('card:' + card.id, k).capital + interest);
    if (total > cap) total = cap;
  }
  return { total: Math.round(total), interest: Math.round(interest), lines, hasOv };
}
function loanDue(l, k) {
  const ov = S.months[k]?.loanOv?.[l.id];
  const hasOv = ov !== undefined && ov !== null;
  let total = hasOv ? ov : l.cuota + (S.months[k]?.carry?.['loan:' + l.id] || 0);
  if (k >= curKey()) {
    const p = paidInfo('loan:' + l.id, k);
    const before = l.saldo + p.capital;
    const cap = Math.max(0, before + before * loanMV(l) / 100);
    if (total > cap) total = cap;
  }
  return { total: Math.round(Math.max(0, total)), hasOv };
}
function loanInterestDue(l, k) {
  const p = paidInfo('loan:' + l.id, k);
  const before = l.saldo + p.capital;
  return Math.max(0, Math.round(before * loanMV(l) / 100) - p.interest);
}
function nextCardPay(c) {
  const k = curKey(), d = cardDue(c, k), p = paidInfo('card:' + c.id, k);
  const done = p.full || p.amount >= d.total;
  if (todayDay() <= c.pagoDia && !done && d.total > 0) return { k, day: c.pagoDia, amount: d.total - p.amount };
  const n = addM(k, 1);
  return { k: n, day: c.pagoDia, amount: cardDue(c, n).total };
}

/* ================= CÁLCULOS DEL MES ================= */
function commitments(k) {
  const m = S.months[k]; if (!m) return [];
  const list = [];
  m.items.forEach(it => list.push({ key: 'item:' + it.id, kind: 'item', name: it.name, day: it.day, due: it.amount, item: it, catId: it.catId, annual: !!it.annualId, rec: !!it.recId, viaCard: (it.payWith || '').startsWith('card:') ? it.payWith.slice(5) : null }));
  S.loans.forEach(l => { const d = loanDue(l, k); list.push({ key: 'loan:' + l.id, kind: 'loan', name: 'Cuota ' + l.name, day: l.dia, due: d.total, loan: l, hasOv: d.hasOv }); });
  S.cards.forEach(c => { const d = cardDue(c, k); list.push({ key: 'card:' + c.id, kind: 'card', name: 'Pago ' + c.name, day: c.pagoDia, due: d.total, interest: d.interest, lines: d.lines, card: c, hasOv: d.hasOv }); });
  const c = curKey(), td = todayDay();
  list.forEach(x => {
    const p = paidInfo(x.key, k);
    x.paid = p.amount; x.full = p.full;
    x.pending = x.full ? 0 : Math.max(0, x.due - x.paid);
    x.status = (x.full || (x.due > 0 && x.paid >= x.due)) ? 'pagado' : x.paid > 0 ? 'parcial' : x.due <= 0 ? 'sinpago' : 'pendiente';
    if (m.carried?.[x.key] && x.status !== 'pagado') { x.status = 'pasado'; x.pending = 0; }
    x.method = p.txs.length ? methodName(p.txs[p.txs.length - 1]) : null;
    x.vencido = (x.status === 'pendiente' || x.status === 'parcial') && (k < c || (k === c && x.day < td));
  });
  list.sort((a, b) => a.day - b.day || a.name.localeCompare(b.name));
  return list;
}
function spendByCat(k) {
  const r = {}; const add = (id, v) => { r[id] = (r[id] || 0) + v; };
  S.txs.forEach(t => {
    if (txMonth(t) !== k) return;
    if (t.type === 'gasto') add(t.catId, t.amount);
    else if (t.type === 'pago') {
      if (t.ref.startsWith('item:')) add(t.catId, t.amount);
      else if ((t.interest || 0) > 0) add('c_int', t.interest);
    }
  });
  return r;
}
function spendByMethod(k) {
  const r = {};
  S.txs.forEach(t => {
    if (txMonth(t) !== k) return;
    if (t.type === 'gasto' || (t.type === 'pago' && t.ref.startsWith('item:'))) { const n = methodName(t); r[n] = (r[n] || 0) + t.amount; }
  });
  return r;
}
function budgetSpend(k) {
  const r = {};
  S.txs.forEach(t => { if (t.type === 'gasto' && !t.auto && !catBy(t.catId)?.noBudget && txMonth(t) === k) r[t.catId] = (r[t.catId] || 0) + t.amount; });
  return r;
}
const cashPending = cm => sum(cm.filter(x => !x.viaCard), 'pending');
const incomeOf = k => sum(S.txs.filter(t => t.type === 'ingreso' && txMonth(t) === k), 'amount');
const qReceived = (q, k) => S.txs.some(t => t.type === 'ingreso' && t.ref === q && t.forMonth === k);
const totalCash = () => sum(S.accounts, 'balance');
const totalDebt = () => sum(S.cards, 'deuda') + sum(S.loans, 'saldo');

        <button onclick="toggleQ('${q}')" class="text-[10px] px-2 py-1 rounded-lg font-bold ${rec ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}">${rec ? '<i class="fa-solid fa-check"></i> Recibida' : 'Marcar recibida'}</button>
        <button onclick="editQ('${q}')" class="text-slate-400 hover:text-purple-400 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
      </div></div>`;
  };
  const ST = {
    pagado: ['Pagado', 'bg-emerald-950 text-emerald-400 border-emerald-800'],
    parcial: ['Parcial', 'bg-amber-950 text-amber-300 border-amber-800'],
    pendiente: ['Pendiente', 'bg-slate-800 text-slate-300 border-slate-700'],
    sinpago: ['Sin pago', 'bg-slate-900 text-slate-500 border-slate-800'],
    pasado: ['Pasado al mes siguiente', 'bg-slate-800 text-slate-400 border-slate-700']
  };
  const row = x => {
    let [lbl, cls] = ST[x.status];
    if (x.vencido) { lbl = x.status === 'parcial' ? 'Parcial vencido' : 'Vencido'; cls = 'bg-rose-950 text-rose-300 border-rose-800'; }
    if (x.status === 'pendiente' && !x.vencido) cls = 'bg-amber-950 text-amber-400 border-amber-800';
    const tag = x.kind === 'card' ? 'Tarjeta' : x.kind === 'loan' ? 'Crédito' : x.annual ? 'Anual' : x.rec ? 'Se repite' : 'Solo este mes';
    const icon = x.kind === 'card' ? 'fa-credit-card' : x.kind === 'loan' ? 'fa-building-columns' : 'fa-wallet';
    const done = x.status === 'pagado';
    const via = x.method || (x.viaCard ? 'Con ' + (cardBy(x.viaCard)?.name || 'tarjeta') : 'Pendiente');
    const editFn = x.kind === 'item' ? `editItem('${x.item.id}')` : `editDue('${x.key}')`;
    return `<div class="bg-slate-900 p-3.5 rounded-2xl border ${done ? 'border-emerald-900/50 bg-slate-900/80' : x.vencido ? 'border-rose-900/60' : 'border-slate-800'} flex items-center gap-3 shadow-md transition">
      <button onclick="openPay('${x.key}')" class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center transition ${done ? 'bg-emerald-600 text-white shadow-md shadow-emerald-900/40' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}" title="Registrar pago"><i class="fa-solid ${done ? 'fa-check' : icon} text-xs"></i></button>
      <div class="flex-1 min-w-0" onclick="openPay('${x.key}')">
        <h4 class="text-xs font-bold truncate ${done ? 'text-slate-400' : 'text-white'}">${esc(x.name)}</h4>
        <span class="text-[10px] text-slate-400 block truncate">Día límite: ${x.day} • ${esc(via)}</span>
        <span class="text-[9px] text-slate-500 block">${tag}${x.hasOv ? ' • ajustado' : ''}</span>
      </div>
      <div class="text-right shrink-0">
        <span class="text-xs font-extrabold ${done ? 'text-slate-400' : 'text-purple-300'} block">${cop(x.due)}</span>
        ${x.status === 'parcial' ? `<span class="text-[9px] text-amber-300 block">Faltan ${cop(x.pending)}</span>` : ''}
        <span class="text-[9px] px-2 py-0.5 rounded-full border ${cls}">${lbl}</span>
      </div>
      <div class="flex items-center shrink-0">
        <button onclick="${editFn}" title="Editar" class="text-slate-400 hover:text-purple-400 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
        ${x.kind === 'item' ? `<button onclick="deleteItem('${x.item.id}')" title="Eliminar" class="text-slate-600 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>` : ''}
      </div></div>`;
  };
  const shown = cm.filter(x => !(hidePaid && (x.status === 'pagado' || x.status === 'sinpago' || x.status === 'pasado')));
  const totalDue = sum(cm, 'due'), totalPaid = sum(cm, x => Math.min(x.due, x.paid) + (x.full && x.paid < x.due ? x.due - x.paid : 0));
  const p = totalDue ? Math.min(100, Math.round(totalPaid / totalDue * 100)) : 0;
  document.getElementById('view').innerHTML = `
    <div class="space-y-2">
      <h2 class="text-sm font-bold px-1"><i class="fa-solid fa-sack-dollar text-emerald-400 mr-1"></i>Quincenas</h2>
      ${qrow('q1')}${qrow('q2')}
    </div>
    <div class="flex justify-between items-center px-1 pt-2">
      <div><h2 class="text-sm font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-file-invoice-dollar text-purple-400"></i> Compromisos fijos</h2>
      <p class="text-[11px] text-slate-400">Arriendo, servicios, mercado, cuotas de créditos y tarjetas</p></div>
      <div class="flex gap-1.5">
        <button onclick="hidePaid=!hidePaid;render()" class="text-[11px] bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-xl text-slate-300">${hidePaid ? 'Ver todos' : 'Ocultar pagados'}</button>
        <button onclick="openAddItem()" class="text-[11px] bg-slate-800 text-purple-300 border border-purple-500/30 font-bold px-2.5 py-1.5 rounded-xl"><i class="fa-solid fa-plus text-[10px]"></i> Agregar</button>
      </div>
    </div>
    <div class="space-y-2">${shown.map(row).join('') || '<p class="text-center text-xs text-slate-500 p-6">No hay pagos para mostrar.</p>'}</div>`;
}

/* ---------- PRESUPUESTO ---------- */
function renderBudget() {
  const m = S.months[M], sp = budgetSpend(M);
  const withB = S.categories.filter(c => (m.budgets[c.id] || 0) > 0);
  const noB = S.categories.filter(c => !(m.budgets[c.id] > 0) && sp[c.id] > 0);
  const card = c => {
    const b = m.budgets[c.id] || 0, s = sp[c.id] || 0, over = b > 0 && s > b, p = b > 0 ? Math.min(100, Math.round(s / b * 100)) : 0;
    return `<div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2">
      <div class="flex justify-between text-xs"><span class="font-bold">${esc(c.name)}</span><span class="text-slate-400">${b > 0 ? 'Presupuesto <b class="text-white">' + cop(b) + '</b>' : 'Sin presupuesto'}</span></div>
      <div class="flex justify-between text-[11px]"><span class="${over ? 'text-rose-400 font-bold' : 'text-slate-300'}">Gastado ${cop(s)}</span>
      <span class="${over ? 'text-rose-400' : 'text-purple-300'} font-bold">${b > 0 ? (over ? 'Pasado por ' + cop(s - b) : 'Quedan ' + cop(b - s)) : ''}</span></div>
      ${b > 0 ? `<div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800"><div class="h-full ${over ? 'bg-rose-500' : 'bg-purple-500'}" style="width:${p}%"></div></div>` : ''}
    </div>`;
  };
  const tb = sum(withB, c => m.budgets[c.id]), ts = sum(withB, c => sp[c.id] || 0);
  document.getElementById('view').innerHTML = `
    <div class="flex justify-between items-center px-1">
      <div><h2 class="text-sm font-bold"><i class="fa-solid fa-sliders text-purple-400 mr-1"></i>Presupuesto vs real</h2>
      <p class="text-[11px] text-slate-400">Solo gastos extra del mes • Presupuestado ${cop(tb)} • Real ${cop(ts)}</p></div>
      <button onclick="openBudgets()" class="text-[11px] bg-slate-800 text-purple-300 border border-purple-500/30 font-bold px-3 py-1.5 rounded-xl"><i class="fa-solid fa-pen text-[10px]"></i> Editar</button>
    </div>
    ${withB.map(card).join('')}
    ${noB.length ? '<h3 class="text-xs font-bold text-slate-400 px-1 pt-2">Gastos en categorías sin presupuesto</h3>' + noB.map(card).join('') : ''}`;
}

      <div class="min-w-0"><span class="text-[11px] font-bold block truncate">${esc(s.name)}</span><span class="text-[9px] text-purple-400">${esc(cardBy(s.cardId)?.name || '—')} • día ${s.day}</span></div>
      <span class="text-[11px] font-extrabold text-purple-200">${cop(s.amount)}</span></div>`).join('');
  document.getElementById('view').innerHTML = `

/* ---------- HISTORIAL ---------- */
function renderHistory() {
  const list = S.txs.filter(t => txMonth(t) === M).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const row = t => {
    let icon, color, sign, sub;
    if (t.type === 'ingreso') { icon = 'fa-arrow-down-long'; color = 'text-emerald-400'; sign = '+'; sub = t.cat || 'Quincena'; }
    else if (t.type === 'transfer') { icon = 'fa-right-left'; color = 'text-sky-300'; sign = ''; sub = 'Transferencia'; }
    else if (t.type === 'pago') { icon = 'fa-check-double'; color = 'text-slate-100'; sign = '-'; sub = t.ref.startsWith('item:') ? catName(t.catId) : 'Pago de deuda'; }
    else { icon = t.card ? 'fa-credit-card' : 'fa-arrow-up-long'; color = 'text-slate-100'; sign = '-'; sub = catName(t.catId); }
    const meth = t.type === 'transfer' ? `${esc(accName(t.acc))} → ${esc(accName(t.accTo))}` : esc(methodName(t));
    const extra = t.type === 'gasto' && (t.n || 1) > 1 ? ` • ${t.n} cuotas` : '';
    return `<div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex items-center gap-3">
      <div class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center bg-slate-800 border border-slate-700 ${color}"><i class="fa-solid ${icon} text-xs"></i></div>
      <div class="flex-1 min-w-0"><h4 class="text-xs font-bold truncate">${esc(t.desc)}</h4>
      <span class="text-[10px] text-slate-400">${esc(sub)} • ${meth} • ${fmtDate(t.date)}${extra}${t.noBalance ? ' • sin mover saldos' : ''}</span></div>
      <span class="text-xs font-black ${color} shrink-0">${sign}${cop(t.amount)}</span>
      <button onclick="delTx('${t.id}')" class="text-slate-600 hover:text-rose-400 p-1 shrink-0"><i class="fa-solid fa-trash-can text-xs"></i></button></div>`;
  };
  document.getElementById('view').innerHTML = `
    <div class="px-1"><h2 class="text-sm font-bold">Movimientos de ${titleOf(M)}</h2>
    <p class="text-[11px] text-slate-400">Si borras un movimiento, el dinero vuelve a la cuenta o tarjeta.</p></div>
    ${list.map(row).join('') || '<p class="text-center text-xs text-slate-500 p-6 bg-slate-900 rounded-2xl border border-slate-800">No hay movimientos este mes.</p>'}`;
}

/* ---------- REPORTES ---------- */
function bars(entries, color) {
  const max = Math.max(1, ...entries.map(e => e[1]));
  return entries.map(([n, v, note]) => `<div class="space-y-1">
      <div class="flex justify-between text-[11px]"><span class="text-slate-300 truncate pr-2">${esc(n)}</span><span class="font-bold">${cop(v)}${note ? ' <span class="text-slate-500 font-normal">' + note + '</span>' : ''}</span></div>
      <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden"><div class="h-full ${color}" style="width:${Math.max(2, v / max * 100)}%"></div></div></div>`).join('');
}
function renderReports() {
  const m = S.months[M];
  const sp = spendByCat(M);
  const byCat = Object.entries(sp).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1])
    .map(([id, v]) => [catName(id), v, (m.budgets[id] || 0) > 0 ? 'de ' + cop(m.budgets[id]) : '']);
  const byMet = Object.entries(spendByMethod(M)).sort((a, b) => b[1] - a[1]);
  const keys = monthKeys().filter(k => k <= curKey()).slice(-6);
  const comp = keys.map(k => ({ k, inc: incomeOf(k), sp: sum(Object.values(spendByCat(k)), x => x) }));
  const cmax = Math.max(1, ...comp.map(c => Math.max(c.inc, c.sp)));
  const compHtml = comp.map(c => `<div class="space-y-1">
      <div class="text-[11px] font-bold text-slate-300">${titleOf(c.k)}</div>
      <div class="flex items-center gap-2 text-[10px]"><span class="w-14 text-slate-400">Ingresos</span><div class="flex-1 bg-slate-950 h-2 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width:${c.inc / cmax * 100}%"></div></div><span class="w-24 text-right">${cop(c.inc)}</span></div>
      <div class="flex items-center gap-2 text-[10px]"><span class="w-14 text-slate-400">Gastos</span><div class="flex-1 bg-slate-950 h-2 rounded-full overflow-hidden"><div class="h-full bg-purple-500" style="width:${c.sp / cmax * 100}%"></div></div><span class="w-24 text-right">${cop(c.sp)}</span></div>
    </div>`).join('');
  const snaps = Object.keys(S.snapshots).sort().map(k => ({ k, v: S.snapshots[k].deuda }));
  let debtHtml;
  if (snaps.length < 2) {
    debtHtml = `<p class="text-[11px] text-slate-400">La gráfica se arma sola: cada mes guarda tu deuda total. Por ahora tienes un solo mes registrado (${snaps[0] ? cop(snaps[0].v) : '—'}).</p>`;
  } else {
    const W = 320, H = 120, mn = Math.min(...snaps.map(s => s.v)), mx = Math.max(...snaps.map(s => s.v));
    const pts = snaps.map((s, i) => [10 + i * (W - 20) / (snaps.length - 1), H - 15 - (s.v - mn) / ((mx - mn) || 1) * (H - 35)]);
    debtHtml = `<svg viewBox="0 0 ${W} ${H}" class="w-full"><polyline fill="none" stroke="#fb7185" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fb7185"/><text x="${p[0]}" y="${H - 2}" fill="#94a3b8" font-size="9" text-anchor="middle">${MSHORT[+snaps[i].k.slice(5) - 1]}</text>`).join('')}</svg>
      <p class="text-[11px] text-slate-400">De ${cop(snaps[0].v)} a ${cop(snaps[snaps.length - 1].v)} (${snaps[snaps.length - 1].v <= snaps[0].v ? 'bajó' : 'subió'} ${cop(Math.abs(snaps[snaps.length - 1].v - snaps[0].v))}).</p>`;
  }
  const comp2 = [...S.cards.map(c => [c.name, c.deuda]), ...S.loans.map(l => [l.name, l.saldo])].filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const box = (t, i, body) => `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2.5"><h3 class="text-xs font-bold uppercase text-slate-300"><i class="fa-solid ${i} text-purple-400 mr-1"></i>${t}</h3>${body}</div>`;
  document.getElementById('view').innerHTML =
    box('Gasto por categoría • ' + monthName(M), 'fa-tags', byCat.length ? bars(byCat, 'bg-purple-500') : '<p class="text-[11px] text-slate-400">Sin gastos este mes.</p>') +
    box('Gasto por medio de pago • ' + monthName(M), 'fa-credit-card', byMet.length ? bars(byMet, 'bg-sky-500') : '<p class="text-[11px] text-slate-400">Sin gastos este mes.</p>') +
    box('Comparación de meses', 'fa-chart-column', compHtml) +
    box('Evolución de la deuda total', 'fa-chart-line', debtHtml + '<div class="pt-2 border-t border-slate-800 space-y-2">' + bars(comp2, 'bg-rose-500') + '</div>');
}

/* ================= HOJAS (MODALES) ================= */
function head(t, ic) {
  return `<div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base"><i class="fa-solid ${ic} text-emerald-400 mr-2"></i>${t}</h3><button onclick="closeSheet()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button></div>`;
}
function openSheet(html) { document.getElementById('sheetBox').innerHTML = html; document.getElementById('sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
let _askRes = null;
function askConfirm(msg, label) {
  return new Promise(res => {
    openSheet(`${head('Confirmar', 'fa-circle-exclamation')}
      <p class="text-sm text-slate-200 leading-relaxed">${esc(msg)}</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="closeSheet()" class="py-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-300">Cancelar</button>
        <button onclick="const f=_askRes;_askRes=null;closeSheet();f&&f(true)" class="py-3 rounded-xl text-xs font-bold bg-rose-600 text-white">${esc(label || 'Sí, continuar')}</button>
      </div>`);
    _askRes = res;
  });
}
function closeSheet() {
  if (_askRes) { const f = _askRes; _askRes = null; f(false); } document.getElementById('sheet').classList.add('hidden'); document.body.style.overflow = ''; }
function done(msg, kind) { save(); closeSheet(); render(); if (msg) toast(msg, kind); }
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast p-3 rounded-xl shadow-xl border text-xs font-semibold flex items-center gap-2 bg-slate-900 ${type === 'ok' ? 'text-emerald-300 border-emerald-800/80' : 'text-rose-300 border-rose-800/80'}`;
  el.innerHTML = `<i class="fa-solid ${type === 'ok' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3200);
}
const catOptions = sel => S.categories.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
const accOptions = sel => S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
function methodOptions(withCards, sel) {
  let h = '<optgroup label="Cuentas y efectivo">' + S.accounts.map(a => `<option value="acc:${a.id}" ${sel === 'acc:' + a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('') + '</optgroup>';
  if (withCards) h += '<optgroup label="Tarjetas de crédito">' + S.cards.map(c => `<option value="card:${c.id}" ${sel === 'card:' + c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('') + '</optgroup>';
  return h;
}
const payWithOptions = sel => `<option value="">Cuenta o efectivo</option>` + S.cards.map(c => `<option value="card:${c.id}" ${sel === 'card:' + c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
const parseMethod = v => { const [t, id] = v.split(':'); return t === 'acc' ? { acc: id } : { card: id }; };
const defaultDate = () => M === curKey() ? todayStr() : (M < curKey() ? dateIn(M, daysIn(M)) : M + '-01');

/* ---------- MESES ---------- */
function goMonth(d) {
  const n = addM(M, d);
  if (S.months[n]) { M = n; render(); return; }
  if (d < 0) { toast('No hay meses anteriores registrados', 'err'); return; }
  openSheet(`${head('Crear ' + titleOf(n), 'fa-calendar-plus')}
    <p class="text-xs text-slate-300 leading-relaxed">Se copian los pagos que se repiten, los pagos anuales que vencen ese mes, las quincenas y el presupuesto. Tus saldos de cuentas, tarjetas y créditos siguen igual, porque son los mismos.</p>
    <button onclick="createNext('${n}')" class="${BTN} bg-purple-600 text-white">Crear ${titleOf(n)}</button>`);
}
function createNext(n) { createMonth(n, addM(n, -1)); M = n; done('Mes ' + titleOf(n) + ' creado'); }
function openMonths() {
  const last = monthKeys().pop(), nx = addM(last, 1);
  openSheet(`${head('Meses', 'fa-calendar-days')}
    <div class="space-y-2">${monthKeys().reverse().map(k => `<button onclick="M='${k}';closeSheet();render()" class="w-full p-3 rounded-xl border ${k === M ? 'bg-purple-950/60 border-purple-800 text-purple-200' : 'bg-slate-950 border-slate-800 text-slate-300'} flex justify-between text-xs font-bold"><span>${titleOf(k)}</span><span class="text-[10px] text-slate-400">${monthStatus(k)}</span></button>`).join('')}</div>
    <button onclick="createNext('${nx}')" class="${BTN} bg-purple-600 text-white"><i class="fa-solid fa-plus mr-1"></i>Crear ${titleOf(nx)}</button>`);
}

/* ---------- MOVIMIENTO ---------- */
function openMove(type) {
  const keep = { a: val('mvAmount'), d: val('mvDesc'), f: val('mvDate') };
  moveType = type;
  const isG = type === 'gasto', isI = type === 'ingreso', isT = type === 'transfer';
  const tb = (t, l, c) => `<button type="button" onclick="openMove('${t}')" class="flex-1 py-2 text-xs font-bold rounded-lg ${moveType === t ? c + ' text-white shadow' : 'text-slate-400'}">${l}</button>`;
  openSheet(`
    <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">${tb('gasto', 'Gasto', 'bg-purple-600')}${tb('ingreso', 'Ingreso', 'bg-emerald-600')}${tb('transfer', 'Transferencia', 'bg-sky-600')}</div>
    <form onsubmit="saveMove(event)" class="space-y-3">
      <div class="text-center py-2 bg-slate-950/50 rounded-2xl border border-slate-800">
        <span class="text-[10px] text-slate-400 font-bold uppercase block">Valor en COP</span>
        <input id="mvAmount" type="number" inputmode="numeric" step="any" placeholder="0" required oninput="updPreview()" class="w-full bg-transparent text-center text-3xl font-black text-white focus:outline-none placeholder:text-slate-700">
      </div>
      <input id="mvDesc" type="text" placeholder="${isG ? 'Qué compraste (ej: Mercado, Televisor)' : isI ? 'De qué es (ej: Transferencia de mamá)' : 'Nota (opcional)'}" ${isT ? '' : 'required'} class="${IN}">
      <div class="grid grid-cols-2 gap-2">
        <div><label class="${LB}">${isG ? 'Medio de pago' : isI ? 'Entra a' : 'Sale de'}</label>
          <select id="mvMethod" onchange="updPreview()" class="${IN}">${isG ? methodOptions(true, 'acc:' + S.accounts[0]?.id) : accOptions(S.accounts[0]?.id)}</select></div>
        ${isT ? `<div><label class="${LB}">Entra a</label><select id="mvTo" class="${IN}">${accOptions(S.accounts[1]?.id)}</select></div>`
      : `<div><label class="${LB}">Categoría</label><select id="mvCat" class="${IN}">${isG ? catOptions('c_ali') : S.incomeCats.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>`}
      </div>
      <div><label class="${LB}">Fecha</label><input id="mvDate" type="date" value="${defaultDate()}" onchange="updPreview()" class="${IN}"></div>
      ${isG ? `<div id="mvCuotasBox" class="hidden bg-purple-950/30 p-3 rounded-xl border border-purple-900/50 space-y-2">
        <label class="${LB} text-purple-300">Número de cuotas</label>
        <select id="mvN" onchange="updPreview()" class="${IN}">${[1, 2, 3, 4, 5, 6, 9, 12, 18, 24, 36, 48].map(n => `<option value="${n}">${n === 1 ? '1 cuota (sin interés)' : n + ' cuotas'}</option>`).join('')}</select>
        <p id="mvPrev" class="text-[11px] text-slate-300 leading-relaxed"></p></div>` : ''}
      ${isT ? '' : `<label class="flex items-start gap-2 text-[11px] text-slate-300"><input id="mvNoBal" type="checkbox" class="mt-0.5"> Ya está incluido en mis saldos o en la deuda de la tarjeta (solo registrarlo, no mover dinero)</label>`}
      <div class="flex gap-2 pt-1">
        <button type="button" onclick="closeSheet()" class="w-1/3 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">Cancelar</button>
        <button type="submit" class="w-2/3 py-3 ${isG ? 'bg-purple-600' : isI ? 'bg-emerald-600' : 'bg-sky-600'} text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-check mr-1"></i>Guardar</button>
      </div>
    </form>`);
  if (keep.a) document.getElementById('mvAmount').value = keep.a;
  if (keep.d) document.getElementById('mvDesc').value = keep.d;
  if (keep.f) document.getElementById('mvDate').value = keep.f;
  updPreview();
}
function updPreview() {
  const box = document.getElementById('mvCuotasBox'); if (!box) return;
  const meth = val('mvMethod');
  if (!meth.startsWith('card:')) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const card = cardBy(meth.slice(5)), P = numv('mvAmount') || 0, n = +val('mvN') || 1, date = val('mvDate') || todayStr();
  const first = payMonth(card, date);
  let txt;
  if (n === 1) txt = `Se suma completo a la deuda de ${esc(card.name)} y al pago del <b>${card.pagoDia} de ${monthName(first).toLowerCase()}</b>.`;
  else {
    const sc = schedule(P, n, S.tasaDiferido), c = sc[0].cuota, tot = c * n;
    txt = `${n} cuotas de <b>${cop(c)}</b> con interés de ${pct(S.tasaDiferido)} MV. Pagarás ${cop(tot)} en total (${cop(tot - P)} de intereses). Primera cuota en el pago del <b>${card.pagoDia} de ${monthName(first).toLowerCase()}</b>.`;
  }
  document.getElementById('mvPrev').innerHTML = txt;
}
function saveMove(e) {
  e.preventDefault();
  const amount = numv('mvAmount');
  if (!(amount > 0)) return toast('Escribe un valor mayor a cero', 'err');
  const date = val('mvDate') || todayStr();
  let desc = val('mvDesc').trim();
  if (moveType === 'gasto') {
    const m = parseMethod(val('mvMethod'));
    const n = m.card ? (+val('mvN') || 1) : 1;
    addTx({ id: uid('t'), type: 'gasto', amount, desc: desc || 'Gasto', catId: val('mvCat'), date, ...m, n, rate: n > 1 ? S.tasaDiferido : 0, noBalance: !!document.getElementById('mvNoBal')?.checked });
  } else if (moveType === 'ingreso') {
    addTx({ id: uid('t'), type: 'ingreso', amount, desc: desc || 'Ingreso', cat: val('mvCat'), acc: val('mvMethod'), date, noBalance: !!document.getElementById('mvNoBal')?.checked });
  } else {
    const from = val('mvMethod'), to = val('mvTo');
    if (from === to) return toast('Las cuentas deben ser distintas', 'err');
    addTx({ id: uid('t'), type: 'transfer', amount, desc: desc || `Transferencia ${accName(from)} → ${accName(to)}`, acc: from, accTo: to, date });
  }
  const mk = date.slice(0, 7);
  if (!S.months[mk] && mk > monthKeys().pop()) createMonth(mk, monthKeys().pop());
  done('Movimiento guardado');
}
async function delTx(id) {
  const t = S.txs.find(x => x.id === id); if (!t) return;
  if (!(await askConfirm(`¿Borrar "${t.desc}" por ${cop(t.amount)}? El dinero vuelve a ${t.type === 'transfer' ? 'las cuentas' : methodName(t)}.`))) return;
  removeTx(id); save(); render(); toast('Movimiento borrado', 'err');
}

/* ---------- QUINCENAS ---------- */
async function toggleQ(q) {
  const k = M, m = S.months[k];
  const t = S.txs.find(x => x.type === 'ingreso' && x.ref === q && x.forMonth === k);
  if (t) {
    if (!(await askConfirm('¿Desmarcar la quincena? Se descuenta de ' + accName(t.acc) + '.'))) return;
    removeTx(t.id); save(); render(); return;
  }
  const inc = m.incomes[q];
  if (!(inc.amount > 0)) return editQ(q);
  addTx({ id: uid('t'), type: 'ingreso', ref: q, forMonth: k, amount: inc.amount, acc: inc.acc, cat: 'Quincena', desc: (q === 'q1' ? 'Primera' : 'Segunda') + ' quincena ' + monthName(k).toLowerCase(), date: k === curKey() ? todayStr() : dateIn(k, inc.day) });
  save(); render(); toast('Quincena sumada a ' + accName(inc.acc));
}
function editQ(q) {
  const inc = S.months[M].incomes[q];
  openSheet(`${head((q === 'q1' ? 'Primera' : 'Segunda') + ' quincena', 'fa-sack-dollar')}
    <div class="grid grid-cols-2 gap-2">
      <div><label class="${LB}">Valor</label><input id="qAmt" type="number" inputmode="numeric" value="${inc.amount}" class="${IN}"></div>
      <div><label class="${LB}">Día que llega</label><input id="qDay" type="number" min="1" max="31" value="${inc.day}" class="${IN}"></div>
    </div>
    <div><label class="${LB}">Cuenta</label><select id="qAcc" class="${IN}">${accOptions(inc.acc)}</select></div>
    <label class="flex items-center gap-2 text-xs text-slate-300"><input id="qNext" type="checkbox" checked> Aplicar también a los meses siguientes ya creados</label>
    <p class="text-[11px] text-slate-500">Si la quincena ya está marcada como recibida, este cambio aplica desde la próxima vez que la marques.</p>
    <button onclick="saveQ('${q}')" class="${BTN} bg-emerald-600 text-white">Guardar</button>`);
}
function saveQ(q) {
  const amount = numv('qAmt'), day = numv('qDay');
  if (!(amount >= 0) || !(day >= 1 && day <= 31)) return toast('Revisa el valor y el día', 'err');
  const data = { amount, day, acc: val('qAcc') };
  const next = document.getElementById('qNext').checked;
  monthKeys().forEach(k => { if (k === M || (next && k > M)) S.months[k].incomes[q] = { ...data }; });
  done('Quincena actualizada');
}

/* ---------- PAGOS DE COMPROMISOS ---------- */
function openPay(key) {
  const x = commitments(M).find(c => c.key === key); if (!x) return;
  const p = paidInfo(key, M);
  let detail = '';
  if (x.kind === 'card') {
    detail = `<div class="bg-slate-950 rounded-xl border border-slate-800 p-3 space-y-1">
      <span class="text-[10px] font-bold uppercase text-slate-400">Qué incluye este pago</span>
      ${x.lines.map(l => `<div class="flex justify-between text-[11px]"><span class="text-slate-300 truncate pr-2">${esc(l.desc)}${l.date ? ' • ' + fmtDate(l.date) : ''}</span><span class="font-bold">${cop(l.amount)}</span></div>`).join('') || '<p class="text-[11px] text-slate-500">Nada por ahora.</p>'}
      ${x.hasOv ? '<p class="text-[10px] text-amber-300 pt-1">Ajustaste a mano el valor de este mes.</p>' : ''}
      ${x.interest > 0 ? `<p class="text-[10px] text-slate-400 pt-1">De este pago, unos ${cop(x.interest)} son intereses de diferidos y no bajan la deuda.</p>` : ''}</div>`;
  } else if (x.kind === 'loan') {
    const it = loanInterestDue(x.loan, M);
    detail = `<p class="text-[11px] text-slate-400 bg-slate-950 rounded-xl border border-slate-800 p-3">De esta cuota, unos <b class="text-slate-200">${cop(it)}</b> son intereses; el resto baja el saldo del crédito. Si el extracto dice otra cosa, ajusta el saldo en Cuentas.</p>`;
  }
  const hist = p.txs.map(t => `<div class="flex justify-between items-center text-[11px] bg-slate-950 p-2 rounded-lg border border-slate-800">
      <span>${fmtDate(t.date)} • ${esc(methodName(t))}${t.noBalance ? ' • sin mover saldos' : ''}</span>
      <span class="flex items-center gap-2 font-bold">${cop(t.amount)}<button onclick="delPay('${t.id}','${key}')" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button></span></div>`).join('');
  openSheet(`${head(esc(x.name), 'fa-wallet')}
    <div class="grid grid-cols-3 gap-2 text-center text-[11px]">
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800"><span class="text-slate-400 block">Valor</span><b>${cop(x.due)}</b></div>
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800"><span class="text-slate-400 block">Pagado</span><b class="text-emerald-400">${cop(x.paid)}</b></div>
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800"><span class="text-slate-400 block">Falta</span><b class="text-purple-200">${cop(x.pending)}</b></div>
    </div>
    ${detail}
    ${hist ? '<div class="space-y-1.5"><span class="text-[10px] font-bold uppercase text-slate-400">Pagos registrados</span>' + hist + `<button onclick="unmarkAll('${key}')" class="w-full py-2.5 rounded-xl text-xs font-bold bg-slate-800 border border-rose-900/60 text-rose-300"><i class="fa-solid fa-rotate-left mr-1"></i>Desmarcar: quitar los pagos y devolver el dinero</button></div>` : ''}
    ${x.status === 'pagado' ? '' : `<form onsubmit="savePay(event,'${key}')" class="space-y-3 pt-2 border-t border-slate-800">
      <div><label class="${LB}">Valor a pagar (total o parcial)</label><input id="pyAmt" type="number" inputmode="numeric" step="any" value="${x.pending}" required class="${IN} text-base font-black text-emerald-400"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="${LB}">Sale de</label><select id="pyMethod" class="${IN}">${methodOptions(x.kind === 'item', x.viaCard ? 'card:' + x.viaCard : 'acc:' + S.accounts[0]?.id)}</select></div>
        <div><label class="${LB}">Fecha</label><input id="pyDate" type="date" value="${defaultDate()}" class="${IN}"></div>
      </div>
      ${x.viaCard ? `<p class="text-[11px] text-slate-400">Si lo pagas con ${esc(cardBy(x.viaCard)?.name)}, se suma a su deuda y al pago del mes que le toque según el corte.</p>` : ''}
      <label class="flex items-start gap-2 text-[11px] text-slate-300"><input id="pyNoBal" type="checkbox" class="mt-0.5"> Ya lo había pagado antes y mis saldos ya lo reflejan (no mover dinero)</label>
      <button type="submit" class="${BTN} bg-emerald-600 text-white">Registrar pago</button>
    </form>`}`);
}
function savePay(e, key) {
  e.preventDefault();
  const x = commitments(M).find(c => c.key === key); if (!x) return;
  const amount = numv('pyAmt');
  if (!(amount > 0)) return toast('Escribe un valor mayor a cero', 'err');
  const p = paidInfo(key, M);
  const t = { id: uid('t'), type: 'pago', ref: key, forMonth: M, amount, date: val('pyDate') || todayStr(), desc: 'Pago ' + x.name.replace(/^Pago /, ''), ...parseMethod(val('pyMethod')), noBalance: document.getElementById('pyNoBal').checked, capital: 0, interest: 0 };
  if (x.kind === 'item') t.catId = x.catId;
  if (x.kind === 'card') { t.interest = Math.min(amount, Math.max(0, x.interest - p.interest)); t.capital = amount - t.interest; }
  if (x.kind === 'loan') { t.interest = Math.min(amount, loanInterestDue(x.loan, M)); t.capital = amount - t.interest; }
  addTx(t);
  done(amount < x.pending ? 'Pago parcial registrado' : 'Pago registrado');
}
async function unmarkAll(key) {
  const p = paidInfo(key, M);
  if (!(await askConfirm('Se borran los pagos registrados (' + cop(p.amount) + '), el dinero vuelve a donde salió y el pago queda pendiente.', 'Sí, desmarcar'))) return openPay(key);
  p.txs.forEach(t => removeTx(t.id)); save(); render(); toast('Pago desmarcado'); openPay(key);
}
async function delPay(id, key) {
  if (!(await askConfirm('¿Borrar este pago? El dinero vuelve a la cuenta y la deuda se restablece.', 'Sí, borrar'))) return openPay(key);
  removeTx(id); save(); render(); openPay(key);
}

/* ---------- PAGOS ATRASADOS DE MESES ANTERIORES ---------- */
function payOld(k, key) { M = k; tab = 'pagos'; render(); openPay(key); }
function carryOver(k, key) {
  const x = commitments(k).find(c => c.key === key); if (!x || !(x.pending > 0)) return;
  const c = curKey(), cm = S.months[c], amt = x.pending;
  if (x.kind === 'item') cm.items.push({ id: uid('i'), name: x.name + ' (atrasado ' + monthName(k).toLowerCase() + ')', amount: amt, day: todayDay(), catId: x.catId, payWith: x.item.payWith || null });
  else { cm.carry = cm.carry || {}; cm.carry[key] = (cm.carry[key] || 0) + amt; }
  S.months[k].carried = S.months[k].carried || {}; S.months[k].carried[key] = true;
  M = c; tab = 'pagos'; save(); render(); toast(x.name + ' pasó a ' + monthName(c).toLowerCase());
}

/* ---------- EDITAR VALORES DE TARJETAS Y CRÉDITOS EN EL MES ---------- */
function editDue(key) {
  const x = commitments(M).find(c => c.key === key); if (!x) return;
  const [kind, id] = key.split(':');
  openSheet(`${head('Ajustar ' + esc(x.name), 'fa-pen')}
    <p class="text-[11px] text-slate-400 leading-relaxed">${kind === 'card' ? 'Cambia el valor a pagar si el extracto dice otra cosa. "Desde este mes" cambia el pago base de la tarjeta; las compras nuevas se siguen sumando encima.' : 'Cambia el valor de la cuota.'}</p>
    <div><label class="${LB}">Valor a pagar</label><input id="edDue" type="number" inputmode="numeric" value="${x.due}" class="${IN}"></div>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="saveDue('${key}','mes')" class="py-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700">Solo este mes</button>
      <button onclick="saveDue('${key}','siguientes')" class="py-3 rounded-xl text-xs font-bold bg-purple-600 text-white">Desde este mes</button>
    </div>
    ${x.hasOv ? `<button onclick="saveDue('${key}','quitar')" class="${BTN} bg-slate-800 text-amber-300 border border-slate-700">Quitar el ajuste de este mes</button>` : ''}
    <button onclick="${kind === 'card' ? `editCard('${id}')` : `editLoan('${id}')`}" class="w-full text-[11px] text-purple-300 underline">Editar deuda total y demás datos</button>`);
}
function saveDue(key, scope) {
  const [kind, id] = key.split(':'), m = S.months[M];
  const ov = kind === 'card' ? m.cardOv : m.loanOv;
  if (scope === 'quitar') { delete ov[id]; return done('Ajuste quitado'); }
  const v = numv('edDue');
  if (!(v >= 0)) return toast('Revisa el valor', 'err');
  if (scope === 'mes') { ov[id] = v; return done('Valor ajustado para este mes'); }
  delete ov[id];
  if (kind === 'card') {
    const c = cardBy(id), d = cardDue(c, M);
    const charges = sum(d.lines.filter(l => !l.base), 'amount');
    c.base = Math.max(0, Math.round(v - charges));
  } else loanBy(id).cuota = v;
  done('Valor actualizado desde este mes');
}

function saveNewItem() {
  const name = val('itName').trim(), amount = numv('itAmt'), day = numv('itDay'), catId = val('itCat'), payWith = val('itPay') || null;
  if (!name || !(amount > 0) || !(day >= 1 && day <= 31)) return toast('Completa nombre, valor y día', 'err');
  if (document.getElementById('itRep').checked) {
    const r = { id: uid('r'), name, amount, day, catId, payWith, from: M, until: null };
    S.recurring.push(r);
    monthKeys().forEach(k => { if (k >= M) S.months[k].items.push({ id: uid('i'), name, amount, day, catId, payWith, recId: r.id }); });
  } else S.months[M].items.push({ id: uid('i'), name, amount, day, catId, payWith });
  done('Pago agregado');
}
const findItem = id => S.months[M].items.find(i => i.id === id);

    <div class="grid grid-cols-2 gap-2">
      <div><label class="${LB}">Categoría</label><select id="itCat" class="${IN}">${catOptions(it.catId)}</select></div>
      <div><label class="${LB}">Normalmente lo pago con</label><select id="itPay" class="${IN}">${payWithOptions(it.payWith)}</select></div>
    </div>
    ${two ? `<p class="text-[11px] text-slate-400">¿A qué meses aplica el cambio?</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="saveItem('${id}',false)" class="py-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700">Solo ${it.annualId ? 'este año' : 'este mes'}</button>
        <button onclick="saveItem('${id}',true)" class="py-3 rounded-xl text-xs font-bold bg-purple-600 text-white">${it.annualId ? 'Todos los años' : 'Este y los siguientes'}</button>
      </div>` : `<button onclick="saveItem('${id}',false)" class="${BTN} bg-purple-600 text-white">Guardar</button>`}`);
}
function saveItem(id, forward) {
  const it = findItem(id); if (!it) return;
  const data = { name: val('itName').trim(), amount: numv('itAmt'), day: numv('itDay'), catId: val('itCat'), payWith: val('itPay') || null };
  if (!data.name || !(data.amount > 0) || !(data.day >= 1 && data.day <= 31)) return toast('Completa nombre, valor y día', 'err');
  Object.assign(it, data);
  if (forward && it.recId) {
    const r = S.recurring.find(x => x.id === it.recId);
    if (r) Object.assign(r, data);
    monthKeys().forEach(k => { if (k > M) S.months[k].items.forEach(i => { if (i.recId === it.recId && !paidInfo('item:' + i.id, k).txs.length) Object.assign(i, data); }); });
  }
  if (forward && it.annualId) {
    const a = S.annual.find(x => x.id === it.annualId);
    if (a) Object.assign(a, { name: data.name, amount: data.amount, day: data.day, catId: data.catId });
  }
  done('Pago actualizado');
}
function deleteItem(id) {
  const it = findItem(id); if (!it) return;
  const paid = paidInfo('item:' + id, M).txs.length;
  const warn = paid ? `<p class="text-[11px] text-amber-300">Este pago ya tiene pagos registrados; esos movimientos quedan en el historial.</p>` : '';
  openSheet(`${head('Borrar ' + esc(it.name), 'fa-trash-can')}${warn}
    ${it.recId ? `<p class="text-[11px] text-slate-400">¿Lo borras solo de este mes o deja de repetirse?</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="removeItem('${id}',false)" class="py-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700">Solo este mes</button>
        <button onclick="removeItem('${id}',true)" class="py-3 rounded-xl text-xs font-bold bg-rose-600 text-white">Este y los siguientes</button>
      </div>` : `<button onclick="removeItem('${id}',false)" class="${BTN} bg-rose-600 text-white">Borrar de ${titleOf(M)}</button>`}
    ${it.annualId ? '<p class="text-[11px] text-slate-500">Para que deje de aparecer cada año, bórralo en Ajustes → Pagos no mensuales.</p>' : ''}`);
}
function removeItem(id, forward) {
  const it = findItem(id); if (!it) return;
  S.months[M].items = S.months[M].items.filter(i => i.id !== id);
  if (forward && it.recId) {
    const r = S.recurring.find(x => x.id === it.recId);
    if (r) r.until = addM(M, -1);
    monthKeys().forEach(k => { if (k > M) S.months[k].items = S.months[k].items.filter(i => !(i.recId === it.recId && !paidInfo('item:' + i.id, k).txs.length)); });
  }
  done('Pago borrado', 'err');
}

/* ---------- PRESUPUESTO ---------- */
function openBudgets() {
  const m = S.months[M];
  openSheet(`${head('Presupuesto de ' + titleOf(M), 'fa-sliders')}
    <p class="text-[11px] text-slate-400">Pon 0 en las categorías que no quieres presupuestar.</p>
    <div class="space-y-2">${S.categories.filter(c => !c.noBudget).map(c => `<div class="flex items-center gap-2"><label class="text-xs flex-1">${esc(c.name)}</label><input id="bd_${c.id}" type="number" inputmode="numeric" value="${m.budgets[c.id] || 0}" class="${IN} w-36"></div>`).join('')}</div>
    <label class="flex items-center gap-2 text-xs text-slate-300"><input id="bdNext" type="checkbox" checked> Usar también en los meses siguientes</label>
    <button onclick="saveBudgets()" class="${BTN} bg-purple-600 text-white">Guardar</button>`);
}
function saveBudgets() {
  const next = document.getElementById('bdNext').checked;
  S.categories.filter(c => !c.noBudget).forEach(c => {
    const v = Math.max(0, numv('bd_' + c.id) || 0);
    monthKeys().forEach(k => { if (k === M || (next && k > M)) S.months[k].budgets[c.id] = v; });
    if (next) c.budget = v;
  });
  done('Presupuesto actualizado');
}

/* ---------- CUENTAS, TARJETAS, CRÉDITOS ---------- */
function editAccounts() {
  openSheet(`${head('Cuentas y efectivo', 'fa-money-bill-transfer')}
    <p class="text-[11px] text-slate-400">Corrige el saldo real de cada cuenta. Para borrar una cuenta, déjala en cero y sin movimientos.</p>
    <div class="space-y-2">${S.accounts.map(a => `<div class="flex items-center gap-2">
      <input id="an_${a.id}" value="${esc(a.name)}" class="${IN} flex-1">
      <input id="ab_${a.id}" type="number" inputmode="numeric" step="any" value="${a.balance}" class="${IN} w-32">
      <button onclick="delAccount('${a.id}')" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button></div>`).join('')}</div>
    <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
      <input id="anNew" placeholder="Nueva cuenta" class="${IN} flex-1"><input id="abNew" type="number" inputmode="numeric" placeholder="Saldo" class="${IN} w-32">
    </div>
    <button onclick="saveAccounts()" class="${BTN} bg-emerald-600 text-white">Guardar</button>`);
}
function saveAccounts() {
  S.accounts.forEach(a => {
    const n = val('an_' + a.id).trim(); if (n) a.name = n;
    const b = parseFloat(val('ab_' + a.id)); if (!isNaN(b)) a.balance = Math.round(b);
  });
  const nn = val('anNew').trim();
  if (nn) S.accounts.push({ id: uid('a'), name: nn, balance: Math.round(parseFloat(val('abNew')) || 0) });
  done('Cuentas actualizadas');
}
function inUse(field, id) { return S.txs.some(t => t[field] === id || t.accTo === id) || S.subs.some(s => s.cardId === id) || Object.values(S.months).some(m => m.incomes.q1.acc === id || m.incomes.q2.acc === id); }
async function delAccount(id) {
  const a = accBy(id);
  if (a.balance !== 0 || inUse('acc', id)) return toast('Solo se puede borrar una cuenta en cero y sin movimientos', 'err');
  if (!(await askConfirm('¿Borrar ' + a.name + '?'))) return;
  S.accounts = S.accounts.filter(x => x.id !== id); save(); editAccounts(); render();
}
function editCard(id) {
  const c = id ? cardBy(id) : { name: '', deuda: 0, base: 0, corte: 1, pagoDia: 15 };
  openSheet(`${head(id ? 'Editar ' + esc(c.name) : 'Nueva tarjeta', 'fa-credit-card')}
    <div><label class="${LB}">Nombre</label><input id="cdName" value="${esc(c.name)}" placeholder="TC ..." class="${IN}"></div>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="${LB}">Deuda total</label><input id="cdDeuda" type="number" inputmode="numeric" value="${c.deuda}" class="${IN}"></div>
      <div><label class="${LB}">Pago base mensual</label><input id="cdBase" type="number" inputmode="numeric" value="${c.base}" class="${IN}"></div>
      <div><label class="${LB}">Día de corte</label><input id="cdCorte" type="number" min="1" max="31" value="${c.corte}" class="${IN}"></div>
      <div><label class="${LB}">Día de pago</label><input id="cdPago" type="number" min="1" max="31" value="${c.pagoDia}" class="${IN}"></div>
    </div>
    <p class="text-[11px] text-slate-400 leading-relaxed">El pago base es lo que pagas cada mes por lo que ya debías. Las compras nuevas se suman encima en el mes que les toca según el corte.</p>
    <button onclick="saveCard('${id || ''}')" class="${BTN} bg-rose-600 text-white">Guardar</button>
    ${id ? `<button onclick="delCard('${id}')" class="w-full text-[11px] text-slate-500 underline">Borrar tarjeta</button>` : ''}`);
}
function saveCard(id) {
  const d = { name: val('cdName').trim(), deuda: numv('cdDeuda'), base: numv('cdBase'), corte: numv('cdCorte'), pagoDia: numv('cdPago') };
  if (!d.name || !(d.deuda >= 0) || !(d.base >= 0) || !(d.corte >= 1 && d.corte <= 31) || !(d.pagoDia >= 1 && d.pagoDia <= 31)) return toast('Revisa los datos', 'err');
  if (id) Object.assign(cardBy(id), d); else S.cards.push({ id: uid('k'), ...d });
  done('Tarjeta guardada');
}
async function delCard(id) {
  if (inUse('card', id)) return toast('La tarjeta tiene movimientos o suscripciones; no se puede borrar', 'err');
  if (!(await askConfirm('¿Borrar la tarjeta?'))) return;
  S.cards = S.cards.filter(c => c.id !== id); done('Tarjeta borrada', 'err');
}
function editLoan(id) {
  const l = id ? loanBy(id) : { name: '', saldo: 0, cuota: 0, dia: 1, tasa: 0, tipoTasa: 'EA' };
  openSheet(`${head(id ? 'Editar ' + esc(l.name) : 'Nuevo crédito', 'fa-building-columns')}
    <div><label class="${LB}">Nombre</label><input id="lnName" value="${esc(l.name)}" class="${IN}"></div>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="${LB}">Saldo (según extracto)</label><input id="lnSaldo" type="number" inputmode="numeric" value="${l.saldo}" class="${IN}"></div>
      <div><label class="${LB}">Cuota mensual</label><input id="lnCuota" type="number" inputmode="numeric" value="${l.cuota}" class="${IN}"></div>
      <div><label class="${LB}">Día de pago</label><input id="lnDia" type="number" min="1" max="31" value="${l.dia}" class="${IN}"></div>
      <div><label class="${LB}">Tasa</label><div class="flex gap-1"><input id="lnTasa" type="number" step="any" value="${l.tasa}" class="${IN}"><select id="lnTipo" class="${IN} w-20"><option ${l.tipoTasa === 'MV' ? 'selected' : ''}>MV</option><option ${l.tipoTasa === 'EA' ? 'selected' : ''}>EA</option></select></div></div>
    </div>
    <button onclick="saveLoan('${id || ''}')" class="${BTN} bg-rose-600 text-white">Guardar</button>
    ${id ? `<button onclick="delLoan('${id}')" class="w-full text-[11px] text-slate-500 underline">Borrar crédito</button>` : ''}`);
}
function saveLoan(id) {
  const d = { name: val('lnName').trim(), saldo: numv('lnSaldo'), cuota: numv('lnCuota'), dia: numv('lnDia'), tasa: parseFloat(val('lnTasa')) || 0, tipoTasa: val('lnTipo') };
  if (!d.name || !(d.saldo >= 0) || !(d.cuota >= 0) || !(d.dia >= 1 && d.dia <= 31)) return toast('Revisa los datos', 'err');
  if (id) Object.assign(loanBy(id), d); else S.loans.push({ id: uid('l'), ...d });
  done('Crédito guardado');
}
async function delLoan(id) {
  if (S.txs.some(t => t.ref === 'loan:' + id)) return toast('El crédito tiene pagos registrados; no se puede borrar', 'err');
  if (!(await askConfirm('¿Borrar el crédito?'))) return;
  S.loans = S.loans.filter(l => l.id !== id); done('Crédito borrado', 'err');
}

/* ---------- QUINCENAS Y SUSCRIPCIONES (ICONOS DEL ENCABEZADO) ---------- */
let reopen = () => openSettings();
function openIncomes() {
  const m = S.months[M];
  const extras = S.txs.filter(t => t.type === 'ingreso' && !t.ref && txMonth(t) === M);
  const q = id => { const inc = m.incomes[id], rec = qReceived(id, M); return `<div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border ${rec ? 'border-emerald-900/60' : 'border-slate-800'}">
      <div><b class="text-xs">${id === 'q1' ? 'Primera quincena' : 'Segunda quincena'}</b><span class="block text-[10px] text-slate-400">Día ${inc.day} • ${esc(accName(inc.acc))} • ${cop(inc.amount)}</span></div>
      <div class="flex items-center gap-1.5"><button onclick="toggleQ('${id}').then(openIncomes)" class="text-[10px] px-2 py-1 rounded-lg font-bold ${rec ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}">${rec ? 'Recibida' : 'Marcar recibida'}</button>
      <button onclick="editQ('${id}')" class="text-slate-400 hover:text-purple-400 p-1"><i class="fa-solid fa-pen text-xs"></i></button></div></div>`; };
  openSheet(`${head('Quincenas e ingresos de ' + monthName(M).toLowerCase(), 'fa-wallet')}
    ${q('q1')}${q('q2')}
    <div class="space-y-1.5"><span class="text-[10px] font-bold uppercase text-slate-400">Ingresos extra</span>
    ${extras.map(t => `<div class="flex justify-between text-[11px] bg-slate-950 p-2 rounded-lg border border-slate-800"><span>${esc(t.desc)} • ${fmtDate(t.date)}</span><b class="text-emerald-400">${cop(t.amount)}</b></div>`).join('') || '<p class="text-[11px] text-slate-500">Ninguno este mes.</p>'}</div>
    <button onclick="openMove('ingreso')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"><i class="fa-solid fa-plus mr-1"></i>Registrar ingreso extra</button>`);
}
function subsHtml() {
  return `${S.subs.map(s => `<div class="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div><b>${esc(s.name)}</b><span class="block text-[10px] text-purple-400">${esc(cardBy(s.cardId)?.name || '—')} • día ${s.day} • ${cop(s.amount)}</span></div><button onclick="delSub('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button></div>`).join('')}
      <div class="grid grid-cols-2 gap-2"><input id="sbName" placeholder="Nombre" class="${IN}"><input id="sbAmt" type="number" inputmode="numeric" placeholder="Valor" class="${IN}">
      <select id="sbCard" class="${IN}">${S.cards.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="sbDay" type="number" min="1" max="31" placeholder="Día de cobro" class="${IN}"></div>
      <button onclick="addSub()" class="${BTN} bg-purple-600 text-white">Agregar suscripción</button>`;
}
function openSubs() {
  reopen = openSubs;
  openSheet(`${head('Suscripciones', 'fa-rotate')}
    <p class="text-[11px] text-slate-400">Se cobran solas a su tarjeta el día indicado: suman a la deuda y al pago del mes que corresponda.</p>
    ${subsHtml()}`);
}

/* ---------- AJUSTES ---------- */
function openSettings() {
  reopen = openSettings;
  const sec = (t, body) => `<section class="space-y-2 pt-3 border-t border-slate-800"><h4 class="text-xs font-bold uppercase text-purple-300">${t}</h4>${body}</section>`;
  openSheet(`${head('Ajustes', 'fa-gear')}
    ${sec('Categorías de gasto', `
      ${S.categories.map(c => `<div class="flex gap-2"><input id="cat_${c.id}" value="${esc(c.name)}" class="${IN}"><button onclick="delCat('${c.id}')" class="text-slate-500 hover:text-rose-400 px-2"><i class="fa-solid fa-trash-can"></i></button></div>`).join('')}
      <div class="flex gap-2"><input id="catNew" placeholder="Nueva categoría" class="${IN}"></div>
      <button onclick="saveCats()" class="${BTN} bg-purple-600 text-white">Guardar categorías</button>`)}
    ${sec('Suscripciones', subsHtml())}
    ${sec('Pagos no mensuales (se repiten cada año)', `
      ${S.annual.map(a => `<div class="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div><b>${esc(a.name)}</b><span class="block text-[10px] text-purple-400">${a.day} de ${MONTHS[a.month - 1].toLowerCase()} • ${cop(a.amount)} • desde ${a.fromYear}</span></div><button onclick="delAnnual('${a.id}')" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button></div>`).join('')}
      <div class="grid grid-cols-2 gap-2"><input id="anName" placeholder="Nombre" class="${IN}"><input id="anAmt" type="number" inputmode="numeric" placeholder="Valor" class="${IN}">
      <input id="anDate" type="date" class="${IN}"><select id="anCat" class="${IN}">${catOptions('c_otr')}</select></div>
      <button onclick="addAnnual()" class="${BTN} bg-purple-600 text-white">Agregar pago anual</button>`)}
    ${sec('Tasa para compras a cuotas', `
      <div class="flex gap-2 items-center"><input id="stTasa" type="number" step="any" value="${S.tasaDiferido}" class="${IN}"><span class="text-xs text-slate-400 shrink-0">% mes vencido</span></div>
      <p class="text-[11px] text-slate-500">Aplica a compras nuevas de 2 o más cuotas. Las de 1 cuota no tienen interés.</p>
      <button onclick="saveTasa()" class="${BTN} bg-purple-600 text-white">Guardar tasa</button>`)}
    ${sec('Respaldo', `
      <p class="text-[11px] text-slate-400">Último respaldo: ${S.lastBackup ? new Date(S.lastBackup).toLocaleDateString('es-CO') : 'nunca'}. Tus datos viven solo en este navegador; si lo borras, se recuperan con el respaldo.</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportData()" class="py-3 rounded-xl text-xs font-bold bg-emerald-600 text-white"><i class="fa-solid fa-download mr-1"></i>Descargar</button>
        <button onclick="document.getElementById('importFile').click()" class="py-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700"><i class="fa-solid fa-upload mr-1"></i>Importar</button>
      </div>`)}`);
}
function saveCats() {
  S.categories.forEach(c => { const n = val('cat_' + c.id).trim(); if (n) c.name = n; });
  const nn = val('catNew').trim();
  if (nn) { const id = uid('c'); S.categories.push({ id, name: nn, budget: 0 }); Object.values(S.months).forEach(m => m.budgets[id] = 0); }
  save(); render(); openSettings(); toast('Categorías guardadas');
}
async function delCat(id) {
  if (S.categories.length <= 1) return;
  const fb = S.categories.find(c => c.id !== id && c.id === 'c_otr') || S.categories.find(c => c.id !== id);
  if (!(await askConfirm(`¿Borrar "${catName(id)}"? Sus movimientos y pagos pasan a "${fb.name}".`))) return;
  S.txs.forEach(t => { if (t.catId === id) t.catId = fb.id; });
  S.recurring.forEach(r => { if (r.catId === id) r.catId = fb.id; });
  S.annual.forEach(a => { if (a.catId === id) a.catId = fb.id; });
  Object.values(S.months).forEach(m => { m.items.forEach(i => { if (i.catId === id) i.catId = fb.id; }); delete m.budgets[id]; });
  S.categories = S.categories.filter(c => c.id !== id);
  save(); render(); openSettings();
}
function addSub() {
  const name = val('sbName').trim(), amount = numv('sbAmt'), day = numv('sbDay'), cardId = val('sbCard');
  if (!name || !(amount > 0) || !(day >= 1 && day <= 31) || !cardId) return toast('Completa todos los datos', 'err');
  const c = curKey();
  S.subs.push({ id: uid('s'), name, amount, cardId, day, next: day > todayDay() ? c : addM(c, 1) });
  save(); render(); reopen();
  toast(day > todayDay() ? 'Se cobrará el ' + day + ' de este mes' : 'Este mes ya se cobró; empieza el próximo');
}
async function delSub(id) { if (!(await askConfirm('¿Borrar la suscripción? Los cobros ya hechos quedan en el historial.'))) return; S.subs = S.subs.filter(s => s.id !== id); save(); render(); reopen(); }
function addAnnual() {
  const name = val('anName').trim(), amount = numv('anAmt'), d = val('anDate'), catId = val('anCat');
  if (!name || !(amount > 0) || !d) return toast('Completa nombre, valor y fecha', 'err');
  const [y, mo, da] = d.split('-').map(Number);
  const a = { id: uid('y'), name, amount, month: mo, day: da, fromYear: y, catId };
  S.annual.push(a);
  monthKeys().forEach(k => { const [ky, km] = k.split('-').map(Number); if (km === mo && ky >= y) S.months[k].items.push({ id: uid('i'), name, amount, day: da, catId, annualId: a.id }); });
  save(); render(); openSettings(); toast('Pago anual agregado');
}
async function delAnnual(id) {
  if (!(await askConfirm('¿Borrar este pago anual? Deja de aparecer en los meses que vienen.'))) return;
  S.annual = S.annual.filter(a => a.id !== id);
  monthKeys().forEach(k => { if (k >= curKey()) S.months[k].items = S.months[k].items.filter(i => !(i.annualId === id && !paidInfo('item:' + i.id, k).txs.length)); });
  save(); render(); openSettings();
}
function saveTasa() {
  const v = parseFloat(val('stTasa'));
  if (!(v >= 0)) return toast('Revisa la tasa', 'err');
  S.tasaDiferido = v; save(); toast('Tasa guardada');
}

/* ---------- RESPALDO ---------- */
function exportData() {
  S.lastBackup = new Date().toISOString(); save();
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mi-control-financiero-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  render(); toast('Respaldo descargado');
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (d.version !== 6 || !d.months || !d.accounts) throw new Error('formato');
      if (!(await askConfirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?'))) return;
      S = d; ensureCurrent(); processSubs(); M = curKey(); save(); closeSheet(); render(); toast('Respaldo importado');
    } catch (err) { toast('El archivo no es un respaldo válido de esta app', 'err'); }
    e.target.value = '';
  };
  r.readAsText(f);
}

/* ================= INICIO ================= */
function init() {
  load();
  ensureCurrent();
  const n = processSubs();
  M = S.months[curKey()] ? curKey() : monthKeys().pop();
  save(); render();
  if (n) toast(n + ' cobro' + (n > 1 ? 's' : '') + ' de suscripción registrado' + (n > 1 ? 's' : ''));
}
window.addEventListener('load', init);
</script>
</body>
